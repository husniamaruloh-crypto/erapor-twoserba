<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portal Akses e-Rapor SMPN 2 Serang Baru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b132b;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .poster-wrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #132247 0%, #070d1f 100%);
    }
    .poster-stage {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100dvh * (16 / 9)));
      height: min(100dvh, calc(100vw * (9 / 16)));
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }
    @media (max-width: 768px) and (orientation: portrait) {
      .poster-stage {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .hotspot:hover, .hotspot:active {
      background-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45), 0 10px 25px rgba(56, 189, 248, 0.35);
      transform: scale(1.015);
    }
    .hotspot-books {
      left: 34.5%;
      top: 39.5%;
      width: 31%;
      height: 29.5%;
    }
    .hotspot-klik {
      left: 38.5%;
      top: 71.5%;
      width: 23%;
      height: 9.5%;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- Baris Kontrol Atas -->
  <div class="fixed top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 z-40 flex items-start justify-between gap-2 pointer-events-none">
    <!-- Status Server & Waktu Pembaruan -->
    <div id="statusBadge" class="pointer-events-auto flex items-center gap-2.5 px-3 py-2 sm:px-3.5 sm:py-2 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-white/15 shadow-lg text-white max-w-[66vw] sm:max-w-xs">
      <span class="relative flex h-2.5 w-2.5 shrink-0">
        <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
        <span id="statusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
      </span>
      <div class="min-w-0 leading-tight">
        <div id="statusLabel" class="text-[11px] sm:text-xs font-bold tracking-wide truncate">Memeriksa Server...</div>
        <div id="lastUpdatedBadge" class="text-[10px] sm:text-[11px] text-slate-300 font-medium truncate mt-0.5">Memuat waktu...</div>
      </div>
      <button id="btnRefreshCheck" type="button" title="Cek Ulang Koneksi Server" class="ml-0.5 p-1.5 rounded-xl bg-white/10 hover:bg-white/20 active:bg-white/25 text-slate-200 transition shrink-0">
        <i id="refreshIcon" data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Tombol Panel Admin -->
    <button id="btnOpenAdmin" type="button" class="pointer-events-auto flex items-center gap-1.5 sm:gap-2 px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-full bg-slate-900/90 hover:bg-slate-800 active:bg-slate-700 backdrop-blur-md border border-white/15 shadow-lg text-[11px] sm:text-xs font-bold text-white transition shrink-0">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-400"></i>
      <span>Panel Admin</span>
    </button>
  </div>

  <!-- Poster Utama Full-Screen -->
  <main class="poster-wrapper">
    <div class="poster-stage">
      <img
        src="https://i.ibb.co.com/n9nknXf/f6c28945-e7ab-4976-bad1-5dd1158413c1.png"
        alt="Portal e-Rapor SMPN 2 Serang Baru"
        class="poster-img"
      />
      <div id="areaBooks" class="hotspot hotspot-books" role="button" tabindex="0" aria-label="Buka e-Rapor lewat Gambar Buku" title="Klik untuk membuka e-Rapor"></div>
      <div id="areaKlikDisini" class="hotspot hotspot-klik" role="button" tabindex="0" aria-label="Klik Disini untuk Buka e-Rapor" title="Klik Disini untuk membuka e-Rapor"></div>
    </div>
  </main>

  <!-- Modal Login PIN Admin -->
  <div id="pinModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-base">Login Panel Admin</h3>
            <p class="text-xs text-slate-500">Masukkan PIN Operator Sekolah</p>
          </div>
        </div>
        <button id="closePinModal" type="button" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="pinForm" class="space-y-4">
        <div>
          <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="••••••" required
            class="w-full text-center text-2xl tracking-[0.4em] font-bold py-3 px-4 rounded-xl border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none text-slate-800" />
          <p id="pinError" class="text-xs text-red-600 mt-1.5 hidden text-center font-medium">PIN salah. Silakan coba lagi.</p>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm transition">
          Buka Pengaturan
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Pengaturan Panel Admin -->
  <div id="adminModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 my-auto">
      <div class="bg-slate-900 px-6 py-4 flex items-center justify-between text-white">
        <div class="flex items-center gap-2.5">
          <i data-lucide="shield-check" class="w-5 h-5 text-amber-400"></i>
          <h3 class="font-bold text-base">Panel Admin e-Rapor</h3>
        </div>
        <button id="closeAdminModal" type="button" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="updateForm" class="p-5 sm:p-6 space-y-4 max-h-[82dvh] overflow-y-auto">
        <!-- Indikator Status Sync Cloud -->
        <div id="cloudSyncAlert" class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 flex items-center justify-between gap-2">
          <span id="cloudSyncText" class="font-semibold">Menghubungkan ke database dberaportwoserba...</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Link Cloudflare Tunnel Terbaru</label>
          <div class="relative flex items-center">
            <input type="url" id="inputCloudflareUrl" placeholder="https://contoh-link.trycloudflare.com" required
              class
